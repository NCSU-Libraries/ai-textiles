project:
  type: website
  output-dir: _site
  resources:
    - images/
    - downloads/
    - video/

website:
  title: "AI-Assisted Data Exploration for Research"
  description: "Use Gemini to explore spreadsheet data, and check what it tells you. A hands-on session from NC State University Libraries' Data Science Services."
  site-url: "https://ncsu-libraries.github.io/ai-data-exploration/"
  repo-url: "https://github.com/NCSU-Libraries/ai-data-exploration"
  favicon: images/favicon.svg
  page-navigation: true
  bread-crumbs: false
  navbar:
    background: "#CC0000"
    foreground: "#FFFFFF"
    logo: images/lib_logo_white.png
    logo-alt: "NC State University Libraries"
    title: false
    collapse-below: lg
    # Gate 0: only the pages students need before the session. Explore, Data security, Practices and Slides
    # join the navbar at Gate 1.
    left:
      - href: index.qmd
        text: Home
      - href: setup.qmd
        text: Setup
      - href: data.qmd
        text: Data
    right:
      - icon: github
        href: "https://github.com/NCSU-Libraries/ai-data-exploration"
        aria-label: "Source on GitHub"
  page-footer:
    left: "NC State University Libraries · [Data Science Services](https://www.lib.ncsu.edu/staff/department/data-science-services) · Help: [go.ncsu.edu/getdatahelp](https://go.ncsu.edu/getdatahelp)"
    right: "Content [CC BY 4.0](https://creativecommons.org/licenses/by/4.0/) · Code MIT · Practice data: [Ahmed (2025)](https://doi.org/10.17632/vs2vjzkw5h.1), CC BY 4.0"

format:
  html:
    theme:
      light: [cosmo, theme/site.scss]
    toc: true
    toc-depth: 2
    code-copy: true
    code-overflow: wrap
    smooth-scroll: true
    anchor-sections: true
    link-external-newwindow: true
    lang: en
