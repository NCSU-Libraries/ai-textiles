project:
  type: website
  output-dir: _site
  resources:
    - images/
    - downloads/

website:
  title: "AI-Assisted Data Exploration for Research"
  description: "Check and summarize a spreadsheet with Gemini and Google Sheets. A hands-on session from NC State University Libraries' Data Science Services."
  site-url: "https://ncsu-libraries.github.io/ai-textiles/"
  repo-url: "https://github.com/NCSU-Libraries/ai-textiles"
  favicon: images/favicon.svg
  bread-crumbs: false
  search: false   # one page: the browser's own find does the job
  # The whole session is one page, index.qmd, so the navbar has no page links. The deck (slides/index.qmd) holds only
  # the opening and closing slides; a small icon beside the GitHub one opens it.
  navbar:
    background: "#CC0000"
    foreground: "#FFFFFF"
    logo: images/lib_logo_white.png
    logo-alt: "NC State University Libraries"
    title: false
    right:
      - href: "https://go.ncsu.edu/getdatahelp"
        text: Get data help
      - icon: easel
        href: slides/index.qmd
        text: " "             # without this, Quarto prints the deck's title beside the icon
        aria-label: "Slides"
      - icon: github
        href: "https://github.com/NCSU-Libraries/ai-textiles"
        aria-label: "Source on GitHub"
  page-footer:
    left: "NC State University Libraries · [Data Science Services](https://www.lib.ncsu.edu/staff/department/data-science-services) · Help: [go.ncsu.edu/getdatahelp](https://go.ncsu.edu/getdatahelp)"
    right: "Content [CC BY 4.0](https://creativecommons.org/licenses/by/4.0/) · Code MIT · Practice data: [Ahmed (2025)](https://doi.org/10.17632/vs2vjzkw5h.1), CC BY 4.0"

format:
  html:
    theme:
      light: [cosmo, theme/site.scss]
    toc: true
    toc-depth: 2
    toc-title: "On this page"
    number-sections: true
    number-depth: 2
    code-copy: true
    code-overflow: wrap
    smooth-scroll: true
    anchor-sections: true
    link-external-newwindow: true
    lang: en
