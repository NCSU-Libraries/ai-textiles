<!doctype html>
<!--
  The stage for the walkthrough video. tools/record-tour.mjs serves this folder over HTTP, loads this page in
  headless Chrome, and drives it through window.stage. The Gemini and Sheets windows are simplified re-creations;
  Gemini's words come from the spike in instructor/dry-run.md, and the sheet holds real rows of the practice data.
  Real screenshots (shots/) and real site pages (site/) appear as overlays and in the browser frame.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tour stage</title>
<style>
  :root { --red: #CC0000; --ink: #1A1A1A; --muted: #6D6E71; --gem: #131314; --gemfg: #E3E3E3; --gembub: #2A2B2E; --sel: #1A73E8; }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1280px; height: 720px; overflow: hidden; background: #ECEAE6; font-family: "Helvetica Neue", Arial, sans-serif; }
  #stage { position: relative; width: 1280px; height: 720px; }

  /* Windows */
  .win { position: absolute; border-radius: 12px; overflow: hidden; box-shadow: 0 18px 50px rgba(0,0,0,.28); transition: all 700ms cubic-bezier(.4,0,.2,1); }
  .bar { height: 30px; display: flex; align-items: center; gap: 7px; padding: 0 12px; font-size: 12px; }
  .dot { width: 11px; height: 11px; border-radius: 50%; display: inline-block; }
  .dot.r { background: #FF5F57; } .dot.y { background: #FEBC2E; } .dot.g { background: #28C840; }
  .url { flex: 1; margin: 0 40px 0 14px; border-radius: 6px; padding: 3px 10px; font-size: 12px; white-space: nowrap; overflow: hidden; }
  .recreated { position: absolute; right: 14px; bottom: 6px; font-size: 11px; color: #888; z-index: 5; }

  /* Gemini (simplified re-creation, dark like the rehearsal's screens) */
  #gem { background: var(--gem); color: var(--gemfg); }
  #gem .bar { background: #202124; color: #AAA; }
  #gem .url { background: #2D2E30; color: #BBB; }
  #gem .side { position: absolute; top: 30px; left: 0; bottom: 0; width: 64px; border-right: 1px solid #2A2A2C; }
  #gem .side .acct { position: absolute; left: 10px; bottom: 14px; width: 44px; height: 44px; border-radius: 50%; background: #5F6368;
                     display: grid; place-content: center; font-weight: 700; color: #FFF; font-size: 17px; transition: box-shadow 300ms; }
  #gem.wide .side { width: 210px; }
  #gem.wide .side .acct { width: auto; height: auto; border-radius: 10px; background: transparent; place-content: initial; display: flex; gap: 10px; align-items: center; padding: 6px 8px; }
  #gem .acct .av { width: 32px; height: 32px; border-radius: 50%; background: #5F6368; display: grid; place-content: center; font-size: 14px; }
  #gem .acct .who { display: none; font-weight: 400; font-size: 13px; line-height: 1.25; color: #E3E3E3; }
  #gem .acct .who small { display: block; color: #9AA0A6; font-size: 12px; }
  #gem.wide .acct .who { display: block; }
  #gem.wide .side .newchat { display: flex; }
  #gem .side .newchat { display: none; position: absolute; left: 14px; top: 18px; gap: 8px; align-items: center; color: #C4C7C5; font-size: 13.5px; }
  #gem .side .acct.hl { box-shadow: 0 0 0 3px var(--red); }
  #gem .main { position: absolute; top: 30px; left: 64px; right: 0; bottom: 0; transition: left 700ms cubic-bezier(.4,0,.2,1); }
  #gem.wide .main { left: 210px; }
  #gem .brand { position: absolute; left: 22px; top: 12px; font-size: 18px; color: #E3E3E3; }
  #gem .brand small { font-size: 12px; color: #9AA0A6; margin-left: 6px; }
  #gem .chat { position: absolute; top: 46px; left: 0; right: 0; bottom: 118px; overflow: hidden; }
  #gem .msgs { position: absolute; left: 26px; right: 26px; bottom: 6px; }
  #gem .hello { position: absolute; left: 0; right: 0; top: 34%; text-align: center; font-size: 30px; color: #C4C7C5; }
  #gem .msg { margin: 10px 0; font-size: 14.5px; line-height: 1.5; }
  #gem .msg.you { margin-left: auto; max-width: 78%; width: fit-content; background: var(--gembub); border-radius: 18px 4px 18px 18px; padding: 10px 16px; white-space: pre-wrap; word-break: break-word; }
  #gem .msg.you.long { max-height: 150px; overflow: hidden; position: relative; }
  #gem .msg.you.long::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 40px; background: linear-gradient(transparent, var(--gembub)); }
  #gem .msg.ai { color: #E3E3E3; padding-left: 36px; position: relative; }
  #gem .msg.ai::before { content: "✦"; position: absolute; left: 4px; top: -1px; color: #8AB4F8; font-size: 18px; }
  #gem .msg.ai p { margin: 0 0 6px; }
  #gem .msg.ai ol { margin: 0; padding-left: 22px; }
  #gem .msg.ai li { margin: 2px 0 6px; }
  #gem .msg.ai li.hl { background: rgba(204,0,0,.22); outline: 2px solid var(--red); border-radius: 4px; }
  #gem code, #gem .f { font: 12.5px/1.45 "JetBrains Mono", Menlo, monospace; color: #D2E3FC; background: #1E1F20; border-radius: 4px; padding: 1px 5px; }
  #gem .f { display: block; margin: 4px 0 8px; padding: 6px 10px; white-space: pre-wrap; word-break: break-all; }
  #gem .thinking { color: #9AA0A6; font-style: italic; }
  #gem .box { position: absolute; left: 26px; right: 26px; bottom: 44px; min-height: 52px; max-height: 120px; background: #1E1F20; border: 1px solid #3C4043;
              border-radius: 26px; padding: 14px 22px; font-size: 14.5px; line-height: 1.4; color: #E3E3E3; white-space: pre-wrap; word-break: break-word; overflow: hidden; }
  #gem .box .ph { color: #8E918F; }
  #gem .caret { display: inline-block; width: 2px; height: 17px; background: #E3E3E3; vertical-align: -3px; animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  #gem .disc { position: absolute; left: 0; right: 0; bottom: 18px; text-align: center; font-size: 12px; color: #9AA0A6; transition: color 300ms; }
  #gem .disc.hl { color: #FFF; }
  #gem .disc.hl span { outline: 2px solid var(--red); border-radius: 4px; padding: 2px 6px; }

  /* Google Sheets (simplified re-creation) */
  #sheet { background: #FFF; color: #202124; }
  #sheet .bar { background: #F1F1F1; color: #444; border-bottom: 1px solid #DDD; }
  #sheet .url { background: #FFF; border: 1px solid #DDD; color: #555; }
  #sheet .doc { height: 38px; display: flex; align-items: center; gap: 10px; padding: 0 14px; font-size: 15px; border-bottom: 1px solid #E0E0E0; }
  #sheet .doc .icon { width: 18px; height: 22px; border-radius: 3px; background: #0F9D58; }
  #sheet .fbar { height: 30px; display: flex; align-items: center; border-bottom: 1px solid #E0E0E0; font-size: 13px; }
  #sheet .namebox { width: 92px; padding: 0 10px; border-right: 1px solid #E0E0E0; height: 100%; display: flex; align-items: center; color: #444; }
  #sheet .fx { padding: 0 10px; color: #888; font-style: italic; border-right: 1px solid #E0E0E0; height: 100%; display: flex; align-items: center; }
  #sheet .ftext { padding: 0 10px; font: 12.5px "JetBrains Mono", Menlo, monospace; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
  #sheet .grid { position: absolute; top: 128px; left: 0; right: 0; bottom: 34px; overflow: hidden; }
  #sheet table { border-collapse: collapse; table-layout: fixed; font-size: 12.5px; }
  #sheet th, #sheet td { border: 1px solid #E2E2E2; height: 22px; padding: 0 5px; white-space: nowrap; overflow: hidden; text-overflow: clip; }
  #sheet th { background: #F8F9FA; color: #5F6368; font-weight: 400; text-align: center; }
  #sheet td.n { text-align: right; }
  #sheet tr.h td { font-weight: 700; background: #F3F3F3; }
  #sheet td.sel { outline: 2px solid var(--sel); outline-offset: -2px; position: relative; z-index: 2; }
  #sheet td.hl { background: #FDECEA !important; outline: 2px solid var(--red); outline-offset: -2px; }
  #sheet td.note { color: #6D6E71; font-style: italic; }
  #sheet td.spill { overflow: visible; position: relative; z-index: 1; }
  #sheet td.title { font-weight: 700; font-size: 15px; }
  #sheet td.match { color: #137333; font-weight: 700; } #sheet td.differs { color: var(--red); font-weight: 700; }
  #sheet .tabs { position: absolute; left: 0; right: 0; bottom: 0; height: 34px; background: #F8F9FA; border-top: 1px solid #E0E0E0; display: flex; align-items: end; padding-left: 50px; gap: 2px; font-size: 13px; }
  #sheet .tab { padding: 7px 16px; color: #444; border-radius: 0 0 6px 6px; }
  #sheet .tab.on { background: #FFF; color: #188038; font-weight: 700; box-shadow: 0 2px 4px rgba(0,0,0,.15); }

  /* Browser frame for real site pages */
  #browser { background: #FFF; }
  #browser .bar { background: #F1F1F1; color: #444; border-bottom: 1px solid #DDD; }
  #browser .url { background: #FFF; border: 1px solid #DDD; color: #555; }
  #browser iframe { position: absolute; top: 30px; left: 0; border: 0; background: #FFF; transform-origin: 0 0; }
  #browser .fade { position: absolute; top: 30px; left: 0; right: 0; bottom: 0; background: #FFF; opacity: 0; transition: opacity 400ms; pointer-events: none; }

  /* Layouts */
  .split #gem { left: 30px; top: 40px; width: 560px; height: 600px; }
  .split #sheet { left: 610px; top: 40px; width: 640px; height: 600px; }
  .split #browser { left: 1300px; top: 40px; width: 900px; height: 600px; opacity: 0; }
  .gem #gem { left: 140px; top: 40px; width: 1000px; height: 600px; }
  .gem #sheet { left: 1300px; top: 40px; width: 640px; height: 600px; opacity: 0; }
  .gem #browser { left: 1300px; top: 40px; width: 900px; height: 600px; opacity: 0; }
  .sheet #gem { left: -620px; top: 40px; width: 560px; height: 600px; opacity: 0; }
  .sheet #sheet { left: 90px; top: 30px; width: 1100px; height: 620px; }
  .sheet #browser { left: 1300px; top: 40px; width: 900px; height: 600px; opacity: 0; }
  .browser #gem { left: -620px; top: 40px; width: 560px; height: 600px; opacity: 0; }
  .browser #sheet { left: -1200px; top: 30px; width: 1100px; height: 620px; opacity: 0; }
  .browser #browser { left: 90px; top: 30px; width: 1100px; height: 620px; }

  /* Overlays */
  #shot { position: absolute; left: 50%; top: 46%; z-index: 20; background: #FFF; border-radius: 12px; padding: 0; overflow: hidden;
          box-shadow: 0 24px 60px rgba(0,0,0,.35); opacity: 0; transform: translate(-50%, -46%) scale(.94); transition: all 600ms cubic-bezier(.2,.8,.2,1); }
  #shot.on { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  #shot .lab { background: #161616; color: #FFF; font: 700 12px "Helvetica Neue", Arial, sans-serif; letter-spacing: 2px; text-transform: uppercase; padding: 8px 14px; }
  #shot .lab::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--red); margin-right: 8px; }
  #shot img { display: block; }
  #note { position: absolute; right: 70px; top: 120px; width: 440px; background: #FFF6C9; border: 1px solid #E8D68A; border-radius: 6px;
          padding: 22px 26px; box-shadow: 0 20px 44px rgba(0,0,0,.25); font-size: 21px; line-height: 1.4; color: var(--ink);
          transform: rotate(-1.5deg) translateY(30px); opacity: 0; transition: all 600ms cubic-bezier(.2,.8,.2,1); z-index: 20; }
  #note.on { opacity: 1; transform: rotate(-1.5deg) translateY(0); }
  #note .from { display: block; font-size: 12px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: #7A6400; margin-bottom: 8px; }
  #note ul { margin: 4px 0 0; padding-left: 22px; }
  #answer { position: absolute; right: 80px; top: 150px; background: #FFF; border: 4px solid var(--red); border-radius: 16px; padding: 16px 30px;
            box-shadow: 0 20px 44px rgba(0,0,0,.25); opacity: 0; transform: scale(.9); transition: all 500ms cubic-bezier(.2,.8,.2,1); z-index: 20; }
  #answer.on { opacity: 1; transform: scale(1); }
  #answer .l { display: block; font-size: 13px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); }
  #answer .v { display: block; font-size: 58px; font-weight: 800; color: var(--red); line-height: 1.05; }

  #caption { position: fixed; left: 50%; bottom: 26px; z-index: 50; max-width: 78vw; padding: 12px 24px; border-radius: 8px;
             background: rgba(12,12,12,.92); color: #FFF; font: 700 23px/1.3 "Helvetica Neue", Arial, sans-serif; white-space: nowrap;
             opacity: 0; transform: translate(-50%, 14px); transition: opacity 320ms ease, transform 320ms ease; box-shadow: 0 12px 34px rgba(0,0,0,.32); }
  #caption::before { content: ""; display: inline-block; width: 5px; height: 20px; margin: 0 12px -3px 0; background: var(--red); }
  #caption.on { opacity: 1; transform: translate(-50%, 0); }
  #step { position: fixed; left: 26px; top: 0; z-index: 50; background: var(--red); color: #FFF; font: 800 14px "Helvetica Neue", Arial, sans-serif;
          letter-spacing: 2px; text-transform: uppercase; padding: 7px 14px; border-radius: 0 0 8px 8px; opacity: 0; transition: opacity 300ms; }
  #step.on { opacity: 1; }

  #card { position: fixed; inset: 0; z-index: 100; display: grid; place-content: center; justify-items: center; gap: 18px; background: #161616;
          color: #FFF; text-align: center; opacity: 0; transition: opacity 600ms ease; pointer-events: none; }
  #card.on { opacity: 1; }
  #card img { height: 44px; }
  #card h1 { margin: 6px 0 0; font: 800 54px/1.08 "Helvetica Neue", Arial, sans-serif; letter-spacing: -0.02em; max-width: 1100px; }
  #card p { margin: 0; color: #D6D6D6; font: 400 24px/1.4 "Helvetica Neue", Arial, sans-serif; max-width: 900px; }
  #card .rule { width: 72px; height: 5px; background: var(--red); }
  #card .points { display: flex; gap: 26px; margin-top: 8px; font: 700 21px/1.3 "Helvetica Neue", Arial, sans-serif; }
  #card .points span::before { content: ""; display: inline-block; width: 9px; height: 9px; margin: 0 10px 2px 0; border-radius: 50%; background: var(--red); }
  #card .list { text-align: left; font: 400 22px/1.7 "Helvetica Neue", Arial, sans-serif; color: #EEE; margin-top: 6px; }
  #card .list div::before { content: "☐  "; color: #FF8A8A; }
  #card .url { font: 700 22px "Helvetica Neue", Arial, sans-serif; color: #FF9E9E; margin-top: 6px; }
</style>
</head>
<body>
<div id="stage" class="sheet">
  <div class="win" id="gem">
    <div class="bar"><span class="dot r"></span><span class="dot y"></span><span class="dot g"></span><span class="url">gemini.google.com</span></div>
    <div class="side">
      <div class="newchat">✎ New chat</div>
      <div class="acct" id="acct"><span class="av">Y</span><span class="who">Your Name<small>Edu</small></span></div>
    </div>
    <div class="main">
      <div class="brand">Gemini <small>Thinking</small></div>
      <div class="chat"><div class="hello" id="hello">Hello, Your Name</div><div class="msgs" id="msgs"></div></div>
      <div class="box" id="gbox"><span id="gtyped"></span><span class="caret"></span><span class="ph" id="gph">Ask Gemini</span></div>
      <div class="disc" id="disc"><span>Your North Carolina State University chats aren’t used to improve our models.</span></div>
    </div>
    <div class="recreated">simplified re-creation</div>
  </div>

  <div class="win" id="sheet">
    <div class="bar"><span class="dot r"></span><span class="dot y"></span><span class="dot g"></span><span class="url">docs.google.com/spreadsheets/…</span></div>
    <div class="doc"><span class="icon"></span><span>Copy of Knitting production data (practice copy)</span></div>
    <div class="fbar"><span class="namebox" id="namebox">A1</span><span class="fx">fx</span><span class="ftext" id="ftext"></span></div>
    <div class="grid" id="grid"></div>
    <div class="tabs" id="tabs"></div>
    <div class="recreated">simplified re-creation</div>
  </div>

  <div class="win" id="browser">
    <div class="bar"><span class="dot r"></span><span class="dot y"></span><span class="dot g"></span><span class="url" id="burl"></span></div>
    <iframe id="frame" title="page"></iframe>
    <div class="fade" id="fade"></div>
  </div>

  <div id="shot"><div class="lab" id="shot-lab"></div><img id="shot-img" alt=""></div>
  <div id="note"></div>
  <div id="answer"><span class="l" id="answer-l"></span><span class="v" id="answer-v"></span></div>
</div>
<div id="step"></div>
<div id="caption"></div>
<div id="card"></div>

<script>
const $ = (id) => document.getElementById(id);
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const esc = (s) => String(s).replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
const LETTERS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
const TABS = ['Data', 'Dictionary', 'Work', 'Compare', 'About'];

// The sheet's model: per tab, sparse cells { 'A1': { v, cls } }, column widths, and the first visible row.
const book = { tab: 'Data', tabs: {}, sel: null };
for (const t of TABS) book.tabs[t] = { cells: {}, widths: [], first: 1, rows: 22, cols: 8 };

function renderGrid() {
  const t = book.tabs[book.tab];
  const widths = t.widths.length ? t.widths : Array(t.cols).fill(100);
  let html = `<table style="width:${46 + widths.reduce((a, b) => a + b, 0)}px"><colgroup><col style="width:46px">${widths.map((w) => `<col style="width:${w}px">`).join('')}</colgroup>`;
  html += `<tr><th></th>${widths.map((_, i) => `<th>${LETTERS[i]}</th>`).join('')}</tr>`;
  for (let r = t.first; r < t.first + t.rows; r++) {
    const rowCls = t.headerRow === r ? ' class="h"' : '';
    html += `<tr${rowCls}><th>${r}</th>`;
    widths.forEach((_, i) => {
      const ref = LETTERS[i] + r, c = t.cells[ref] || {};
      const cls = [c.cls || '', book.sel === ref ? 'sel' : '', (t.hl || []).includes(ref) ? 'hl' : ''].join(' ').trim();
      html += `<td id="cell-${ref}" class="${cls}">${c.v === undefined ? '' : esc(c.v)}</td>`;
    });
    html += '</tr>';
  }
  $('grid').innerHTML = html + '</table>';
  $('tabs').innerHTML = TABS.map((n) => `<span class="tab${n === book.tab ? ' on' : ''}">${n}</span>`).join('');
}

window.stage = {
  layout(name) { $('stage').className = name; },
  caption(text) {
    const c = $('caption');
    if (!text) { c.classList.remove('on'); return; }
    c.textContent = text; c.classList.add('on');
  },
  step(text) { const s = $('step'); if (!text) { s.classList.remove('on'); return; } s.textContent = text; s.classList.add('on'); },
  card(title, sub, opts = {}) {
    const card = $('card');
    if (!title) { card.classList.remove('on'); return; }
    let html = `<img src="logo-white.png" alt=""><h1>${esc(title)}</h1><div class="rule"></div>`;
    if (sub) html += `<p>${esc(sub)}</p>`;
    if (opts.points) html += `<div class="points">${opts.points.map((p) => `<span>${esc(p)}</span>`).join('')}</div>`;
    if (opts.list) html += `<div class="list">${opts.list.map((p) => `<div>${esc(p)}</div>`).join('')}</div>`;
    if (opts.url) html += `<div class="url">${esc(opts.url)}</div>`;
    card.innerHTML = html;
    if (opts.instant) { card.style.transition = 'none'; card.classList.add('on'); card.offsetWidth; card.style.transition = ''; }
    else card.classList.add('on');
  },

  gem: {
    wide(on) { $('gem').classList.toggle('wide', on); },
    clear() { $('msgs').innerHTML = ''; $('hello').style.display = ''; },
    highlight(what, on) { $(what === 'acct' ? 'acct' : 'disc').classList.toggle('hl', on); },
    async type(text, delay = 20) {
      const t = $('gtyped'); t.textContent = ''; $('gph').style.display = 'none';
      for (const ch of text) { t.textContent += ch; await sleep(delay + Math.random() * 14); }
    },
    async paste(text) { $('gph').style.display = 'none'; $('gtyped').textContent = text; await sleep(200); },
    async send() {
      const text = $('gtyped').textContent; $('gtyped').textContent = ''; $('gph').style.display = '';
      $('hello').style.display = 'none';
      const d = document.createElement('div');
      d.className = 'msg you' + (text.length > 400 ? ' long' : '');
      d.textContent = text;
      $('msgs').append(d);
      window.stage.gem.trim();
      await sleep(300);
    },
    // Show a thinking line, then reveal the answer's blocks one at a time.
    async answer(blocks, gap = 380, think = 900) {
      const d = document.createElement('div'); d.className = 'msg ai';
      d.innerHTML = '<p class="thinking">Thinking…</p>';
      $('msgs').append(d); window.stage.gem.trim();
      await sleep(think);
      d.innerHTML = '';
      for (const html of blocks) {
        const tmp = document.createElement('div'); tmp.innerHTML = html;
        while (tmp.firstChild) d.append(tmp.firstChild);
        window.stage.gem.trim();
        await sleep(gap);
      }
      return d;
    },
    // An ordered list revealed item by item.
    async list(items, gap = 520) {
      const d = $('msgs').lastElementChild;
      const ol = document.createElement('ol'); d.append(ol);
      for (const html of items) { const li = document.createElement('li'); li.innerHTML = html; ol.append(li); window.stage.gem.trim(); await sleep(gap); }
    },
    mark(n, on = true) {
      const li = $('msgs').lastElementChild.querySelectorAll('li')[n];
      if (li) li.classList.toggle('hl', on);
    },
    trim() {
      const box = $('msgs'), max = box.parentElement.clientHeight - 10;
      while (box.offsetHeight > max && box.children.length > 1) box.firstElementChild.remove();
      // A single long answer: drop its first blocks so the end stays in view.
      const last = box.lastElementChild;
      while (box.offsetHeight > max && last && last.children.length > 1) {
        const first = last.firstElementChild;
        if (first.tagName === 'OL' && first.children.length > 1) first.firstElementChild.remove(); else first.remove();
      }
    },
  },

  sheet: {
    tab(name) { book.tab = name; book.sel = null; $('ftext').textContent = ''; renderGrid(); },
    setup(name, cfg) { Object.assign(book.tabs[name], cfg); if (book.tab === name) renderGrid(); },
    set(ref, v, cls, tab = book.tab) { book.tabs[tab].cells[ref] = { v, cls }; if (tab === book.tab) renderGrid(); },
    scrollTo(first) { book.tabs[book.tab].first = first; renderGrid(); },
    select(ref, formula) {
      book.sel = ref; $('namebox').textContent = ref;
      const c = book.tabs[book.tab].cells[ref];
      $('ftext').textContent = formula !== undefined ? formula : (c && c.f) || (c && c.v !== undefined ? c.v : '');
      renderGrid();
    },
    hl(refs) { book.tabs[book.tab].hl = refs || []; renderGrid(); },
    // Type a formula into a cell (shown in the formula bar), then show its result.
    async formula(ref, f, result, cls = 'n', delay = 8) {
      window.stage.sheet.select(ref, '');
      const ft = $('ftext');
      for (const ch of f) { ft.textContent += ch; await sleep(delay); }
      await sleep(350);
      book.tabs[book.tab].cells[ref] = { v: result, cls, f };
      renderGrid();
    },
    // Where a cell is on the stage, for the cursor.
    where(ref) {
      const el = $('cell-' + ref); if (!el) return null;
      const r = el.getBoundingClientRect();
      return { x: r.left + Math.min(r.width / 2, 40), y: r.top + r.height / 2 };
    },
  },

  browser: {
    async load(src, label, zoom = 0.62) {
      const f = $('frame');
      $('fade').style.opacity = 1;
      await sleep(300);
      const w = $('browser').clientWidth, h = $('browser').clientHeight - 30;
      f.style.width = (w / zoom) + 'px'; f.style.height = (h / zoom) + 'px'; f.style.transform = `scale(${zoom})`;
      await new Promise((r) => { f.onload = r; f.src = src; });
      $('burl').textContent = label || src;
      await sleep(500);
      $('fade').style.opacity = 0;
    },
    async scrollTo(selector, ms = 1200, offset = 70) {
      const win = $('frame').contentWindow, el = win.document.querySelector(selector);
      const y = el ? el.getBoundingClientRect().top + win.scrollY - offset : 0;
      const from = win.scrollY, start = performance.now();
      await new Promise((resolve) => {
        const tick = (now) => {
          const p = Math.min(1, (now - start) / ms), e = p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
          win.scrollTo(0, from + (y - from) * e);
          if (p < 1) requestAnimationFrame(tick); else resolve();
        };
        requestAnimationFrame(tick);
      });
    },
  },

  shot(label, src, width) {
    if (!label) { $('shot').classList.remove('on'); return; }
    $('shot-lab').textContent = label; $('shot-img').src = src; $('shot-img').style.width = width + 'px';
    return new Promise((r) => { $('shot-img').onload = () => { $('shot').classList.add('on'); r(); }; });
  },
  note(html) { const n = $('note'); if (!html) { n.classList.remove('on'); return; } n.innerHTML = html; n.classList.add('on'); },
  answer(label, value) {
    if (!label) { $('answer').classList.remove('on'); return; }
    $('answer-l').textContent = label; $('answer-v').textContent = value; $('answer').classList.add('on');
  },
};
renderGrid();
</script>
</body>
